name: Build DexQuest GO APK
on:
  push:
    branches: [main]
    paths:
      - 'DexQuest-GO/**'
      - '.github/workflows/dexquest-go.yml'
  pull_request:
    paths:
      - 'DexQuest-GO/**'
      - '.github/workflows/dexquest-go.yml'
  workflow_dispatch:
permissions:
  contents: write
env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK 35
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Check Pokédex data and interface
        working-directory: DexQuest-GO
        run: |
          python3 tests/check_project.py
          node tests/smoke.js
      - name: Build debug APK
        working-directory: DexQuest-GO
        run: ./build-apk.sh
      - name: Publish downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: DexQuest-GO-v1.0-debug-APK
          path: DexQuest-GO/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish stable GitHub Release download
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: DexQuest-GO
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view dexquest-go-v1.0 >/dev/null 2>&1; then
            cp app/build/outputs/apk/debug/app-debug.apk DexQuest-GO-v1.0-debug.apk
            gh release create dexquest-go-v1.0 DexQuest-GO-v1.0-debug.apk --title 'DexQuest GO v1.0 (Android APK)' --notes 'Unofficial offline-first Pokémon GO companion: Pokédex, Shinies, Candy Planner, and Storage Cleaner. Debug-signed APK for sideloading.' --target "$GITHUB_SHA"
          fi
