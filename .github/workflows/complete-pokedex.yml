name: Build DexQuest Complete APK
on:
  push:
    branches: [feature/complete-pokedex-v1, main]
    paths:
      - 'complete-pokedex/**'
      - '.github/workflows/complete-pokedex.yml'
  pull_request:
    paths:
      - 'complete-pokedex/**'
      - '.github/workflows/complete-pokedex.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: complete-pokedex
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: DexQuest-Complete-Debug-APK
          path: complete-pokedex/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
